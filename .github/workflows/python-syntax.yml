name: Python syntax check

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/renderster-integration]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile bot.py
        run: python -m py_compile bot.py
