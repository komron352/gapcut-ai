<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>GAPCUT AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--soft:#f3f3f6;--line:#e7e7ee;--tx:#14131a;--mu:#85829a;--g:linear-gradient(135deg,#ffa31a 0%,#ff3d7f 50%,#8b3dff 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","DejaVu Sans",sans-serif}
body{min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 110px)}
main{max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{font-size:23px;font-weight:900;letter-spacing:-.5px}.logo i{font-style:normal;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.ava{margin-left:auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--g);background-size:cover}
.tab{display:none}.tab.on{display:block}
.hero{position:relative;overflow:hidden;width:100%;border:0;text-align:left;border-radius:26px;padding:24px 20px;color:#fff;display:flex;align-items:center;gap:14px;background:radial-gradient(120% 140% at 0% 100%,#7a2d4a 0%,transparent 55%),radial-gradient(80% 100% at 100% 0%,#35205a 0%,transparent 60%),#17141f;box-shadow:0 16px 34px rgba(20,19,26,.25)}
.hero b{display:block;font-size:24px;margin-bottom:6px}.hero small{display:block;color:#cfc9e0;font-size:14px;line-height:1.35;max-width:210px}
.plus{margin-left:auto;flex:none;width:50px;height:50px;border-radius:50%;background:#fff;color:#14131a;display:grid;place-items:center;font-size:30px;font-weight:300}
.hero:active,.item:active,.big:active{transform:scale(.98)}
.row{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px}.row b{font-size:17px}.row span{color:var(--mu);font-size:14px}
.empty{background:var(--soft);border-radius:22px;padding:34px 20px;text-align:center;color:var(--mu);line-height:1.45}
.empty button{margin-top:16px}
.btn{border:0;border-radius:16px;padding:15px 26px;font-size:16px;font-weight:800;color:#fff;background:var(--g);box-shadow:0 10px 22px rgba(255,61,127,.3)}
h2{font-size:26px;margin:4px 0 16px;font-weight:900}
.card{background:var(--soft);border-radius:22px;padding:6px 16px;margin-bottom:14px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:15px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--tx);font:inherit;font-size:16px;text-align:left;text-decoration:none}
.item:first-child{border-top:0}.item i{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:19px;background:#fff}
.item b{flex:1;font-weight:700}.item span{color:var(--mu);font-size:14px}
.who{display:flex;align-items:center;gap:16px;padding:16px 0}
.pic{flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff;background:var(--g);background-size:cover;background-position:center}
.who b{display:block;font-size:22px;line-height:1.15;word-break:break-word}.who small{color:var(--mu);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:14px}.tag{padding:6px 12px;border-radius:999px;background:#fff;font-size:12px;font-weight:700}
nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:496px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:10px 6px 8px;border-radius:28px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);box-shadow:0 10px 36px rgba(20,19,26,.16);border:1px solid var(--line)}
nav a,nav button{border:0;background:none;color:var(--mu);font:inherit;font-size:11px;font-weight:700;padding:4px 0;text-align:center;text-decoration:none}
nav i{display:block;font-style:normal;font-size:21px;margin-bottom:3px}
nav .on{color:var(--tx)}
nav .big{margin-top:-34px;color:var(--tx);transition:transform .1s}
nav .big i{width:62px;height:62px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:26px;background:var(--g);box-shadow:0 10px 22px rgba(255,61,127,.45),0 0 0 5px #fff}
button:focus-visible,a:focus-visible{outline:3px solid #8b3dff;outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.tab.on{animation:in .25s ease both}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main>
  <div class="top"><div class="logo">GAPCUT<i>.</i></div><div class="ava" id="topAva">G</div></div>

  <section class="tab on" id="t-home">
    <button class="hero" id="newBtn"><span><b id="newT"></b><small id="newS"></small></span><span class="plus">+</span></button>
    <div class="row"><b id="lastT"></b></div>
    <div class="empty"><span id="lastE"></span><br><button class="btn" data-go id="lastB"></button></div>
  </section>

  <section class="tab" id="t-res">
    <h2 id="resT"></h2>
    <div class="empty"><span id="resE"></span><br><button class="btn" data-go id="resB"></button></div>
  </section>

  <section class="tab" id="t-prof">
    <h2 id="profT"></h2>
    <div class="card">
      <div class="who"><div class="pic" id="av">G</div><div><b id="uname"></b><small id="uhandle"></small></div></div>
      <div class="tags" id="tags"></div>
    </div>
    <div class="card">
      <button class="item" id="langRow"><i>🌐</i><b id="langL"></b><span id="langV"></span></button>
      <a class="item" id="supA" target="_blank" rel="noopener"><i>💬</i><b id="supL"></b><span>›</span></a>
      <a class="item" id="chA" target="_blank" rel="noopener"><i>📢</i><b id="chL"></b><span>›</span></a>
      <div class="item"><i>ℹ️</i><b id="aboutL"></b><span>v4.0</span></div>
    </div>
  </section>
</main>

<nav>
  <button data-tab="home" class="on"><i>⌂</i><span id="n1"></span></button>
  <button data-tab="res"><i>▤</i><span id="n2"></span></button>
  <button class="big" data-go><i>✦</i><span id="n3"></span></button>
  <a id="n4a" target="_blank" rel="noopener"><i>💬</i><span id="n4"></span></a>
  <button data-tab="prof"><i>☺</i><span id="n5"></span></button>
</nav>

<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#ffffff");tg.setBackgroundColor("#ffffff")}catch(e){}}
const EDITOR="editor.html",SUPPORT="https://t.me/aikomron",CHANNEL="https://t.me/gapcutai";
const $=id=>document.getElementById(id);
const T={
ru:{newT:"Новый ролик",newS:"Загрузите видео — смонтируем за пару минут",lastT:"Последнее",lastE:"Здесь появятся ваши ролики. Пока пусто.",lastB:"Создать ролик",resT:"Результаты",resE:"Готовое видео вы скачиваете сразу после создания.",resB:"Создать ролик",n1:"Главная",n2:"Результаты",n3:"Монтаж",n4:"Поддержка",n5:"Профиль",profT:"Профиль",langL:"Язык интерфейса",langV:"Русский",supL:"Поддержка",chL:"Наш канал",aboutL:"О приложении",guest:"Гость",tgId:"Telegram ID",prem:"Premium"},
tg:{newT:"Видеои нав",newS:"Видеоро бор кунед — дар чанд дақиқа монтаж мекунем",lastT:"Охирин",lastE:"Дар ин ҷо видеоҳои шумо пайдо мешаванд. Ҳоло холӣ аст.",lastB:"Сохтани видео",resT:"Натиҷаҳо",resE:"Видеои тайёрро баробари сохтан зеркашӣ мекунед.",resB:"Сохтани видео",n1:"Асосӣ",n2:"Натиҷаҳо",n3:"Монтаж",n4:"Дастгирӣ",n5:"Профил",profT:"Профил",langL:"Забони интерфейс",langV:"Тоҷикӣ",supL:"Дастгирӣ",chL:"Канали мо",aboutL:"Дар бораи барнома",guest:"Меҳмон",tgId:"Telegram ID",prem:"Premium"}
};
const user=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||null;
let L=(user&&user.language_code==="tg")?"tg":"ru";
try{const s=localStorage.getItem("gc_ui");if(s==="ru"||s==="tg")L=s}catch(e){}
function avatar(el,name){el.style.backgroundImage="";el.textContent=(name[0]||"G").toUpperCase();
  if(user&&user.photo_url){const im=new Image();im.onload=()=>{el.textContent="";el.style.backgroundImage="url('"+user.photo_url+"')"};im.src=user.photo_url}}
function render(){
  const t=T[L];document.documentElement.lang=L;
  const full=user?[user.first_name,user.last_name].filter(Boolean).join(" "):"";
  const name=full||t.guest;
  ["newT","newS","lastT","lastE","lastB","resT","resE","resB","n1","n2","n3","n4","n5","profT","langL","langV","supL","chL","aboutL"].forEach(k=>$(k).textContent=t[k]);
  $("uname").textContent=name;$("uhandle").textContent=user&&user.username?"@"+user.username:"";
  const tags=[];if(user&&user.id)tags.push(t.tgId+": "+user.id);if(user&&user.is_premium)tags.push("⭐ "+t.prem);
  $("tags").innerHTML="";tags.forEach(x=>{const s=document.createElement("span");s.className="tag";s.textContent=x;$("tags").appendChild(s)});
  avatar($("av"),name);avatar($("topAva"),name);
  $("supA").href=SUPPORT;$("n4a").href=SUPPORT;$("chA").href=CHANNEL;
}
const go=()=>{location.href=EDITOR};
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=go);$("newBtn").onclick=go;
document.querySelectorAll("nav [data-tab]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav [data-tab]").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".tab").forEach(s=>s.classList.toggle("on",s.id==="t-"+b.dataset.tab));
  window.scrollTo(0,0)});
$("langRow").onclick=()=>{L=L==="ru"?"tg":"ru";try{localStorage.setItem("gc_ui",L)}catch(e){}render()};
render();
</script>
</body>
</html>
